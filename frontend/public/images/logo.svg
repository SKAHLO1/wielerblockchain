<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c9d6f2"/>
      <stop offset="0.55" stop-color="#8ea3cf"/>
      <stop offset="1" stop-color="#dfe8fb"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a6f9e"/>
      <stop offset="1" stop-color="#2a3a64"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- outer W -->
    <path d="M4 6 L28 6 L42 46 L52 18 L68 18 L78 46 L92 6 L116 6 L88 76 L70 76 L60 50 L50 76 L32 76 Z" fill="url(#steel)"/>
    <!-- bevel facets -->
