    <path d="M68 18 L78 46 L70 76 L60 50 Z" fill="url(#shade)" opacity="0.5"/>
    <path d="M116 6 L92 6 L78 46 L88 76 Z" fill="#ffffff" opacity="0.18"/>
    <path d="M52 18 L60 40 L60 50 L50 76 L42 46 Z" fill="#ffffff" opacity="0.12"/>
  </g>
</svg>
