[package]
name = "wieler-raid"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
near-contract-standards = { workspace = true }
hex = "0.4"
bs58 = "0.5"
primitive-types = { version = "0.12", default-features = false }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
